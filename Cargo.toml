[package]
name = "shred-fwd"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Low-latency UDP shred forwarder using AF_PACKET"
repository = "https://github.com/mindrunner/shred-fwd"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tiny_http = "0.12"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
strip = true
